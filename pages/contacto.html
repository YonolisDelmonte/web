        <nav class="principal" aria-label="Navegación principal">
            <h2 class="pechado">Menú Principal</h2>
            <input id="icon-menu" name="icon-menu" type="checkbox" />

        </nav>

        <main class="agua">
            <section>
                <header class="img-before portada">
                    <h2>Contactanos con nosotros</h2>
                </header>

                <article>
                    <h3>Formulario de Contacto</h3>

                    <form action="enviados.html" class="form" id="form" method="post" enctype="multipart/form-data">
                        <fieldset>
                            <legend>Datos Personales</legend>
                            <ul>
                                <li>
                                    <label for="name">Nombre</label>
                                    <input type="text" name="name" id="name" placeholder="Tu Nombre" required />
                                </li>
                                <li>
                                    <label for="email">E-mail</label>
                                    <input type="email" name="email" id="email" placeholder="Correo Electronico" required />
                                </li>
                                <li>
                                    <label for="tfno">Telefono</label>
                                    <input type="tel" name="tfno" id="tfno" placeholder="Telefono" />
                                </li>
                                <li>
                                    <label for="edad">Edad</label>
                                    <input type="number" name="edad" id="edad" placeholder="Tu Edad" />
                                </li>
                                <li>
                                    <input type="radio" name="coche" id="coche-si" value="si" />
                                    <label for="coche-si">Coche Propio: Si</label>
                                </li>
                                <li>
                                    <input type="radio" name="coche" id="coche-no" value="no" />
                                    <label for="coche-no">Coche Propio: No</label>
                                </li>
                                <li>
                                    <input type="checkbox" name="acepto" id="acepto" required />
                                    <label for="acepto">Acepto el uso de mis datos personales</label>
                                </li>
                                <li>
                                    <label for="mensaje">Tu mensaje</label>
                                    <textarea name="mensaje" id="mensaje" cols="100" rows="10" placeholder="Deja tu mensaje"></textarea>
                                </li>
                            </ul>
                        </fieldset>
                        <p id="errores"></p>
                        <ul class="enviar">
                            <li>
                                <input type="submit" value="Enviar" id="enviar" />
                            </li>
                            <li>
                                <input type="reset" value="Borrar" />
                            </li>
                        </ul>
                    </form>
                </article>
            </section>
        </main>
        <footer></footer>
    </body>
